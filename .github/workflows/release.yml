# Builds static Linux and Windows binaries. Pushing a tag like v0.1.0
# publishes them as a GitHub release; other runs keep them as artifacts.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo test --locked

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
            binary: nfs-lan-server
            archive: nfs-lan-server-linux-x86_64.tar.gz
          - target: x86_64-pc-windows-gnu
            packages: gcc-mingw-w64-x86-64
            binary: nfs-lan-server.exe
            archive: nfs-lan-server-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build
        env:
          # Statically link the C runtime so the binary needs nothing installed.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist/nfs-lan-server
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} README.md nfs-lan-server.example.ini dist/nfs-lan-server/
          cd dist
          case "${{ matrix.archive }}" in
            *.zip) zip -r ${{ matrix.archive }} nfs-lan-server ;;
            *) tar czf ${{ matrix.archive }} nfs-lan-server ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
